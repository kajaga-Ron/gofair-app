<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoFair — Trip Tracker</title>
<style>
  :root{ --asphalt:#1C1F26; --paper:#F7F4EE; --amber:#F2A93B; --teal:#2F7A5E; --rust:#C1442B; --ink:#1C1F26; --ink-soft:#6B6F76; --line:rgba(28,31,38,0.12); }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--asphalt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px;}
  .card{background:var(--paper);border-radius:18px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  .brand{font-size:18px;font-weight:800;margin-bottom:18px;}
  .brand span{color:var(--amber);}
  .status-pill{display:inline-block;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:16px;}
  .status-pill.open{background:#FCE8C7;color:#8A5A0D;}
  .status-pill.accepted{background:#D9EFE3;color:var(--teal);}
  .status-pill.completed{background:#E4E4E4;color:var(--ink-soft);}
  .status-pill.unknown{background:#F6D9D2;color:var(--rust);}
  .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row b{font-weight:700;}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:20px 0;}
  .refresh-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Go<span>Fair</span> — Trip Tracker</div>
  <div id="content">Loading…</div>
  <div class="refresh-note">Updates automatically every few seconds.</div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const tripId = params.get('trip');

function statusLabel(s, arrived){
  if (s === 'completed') return { text: 'Trip completed', cls: 'completed' };
  if (s === 'accepted') return { text: arrived ? 'Driver has arrived' : 'Driver en route', cls: 'accepted' };
  if (s === 'open') return { text: 'Waiting for a driver', cls: 'open' };
  return { text: 'Unavailable', cls: 'unknown' };
}

async function load(){
  const content = document.getElementById('content');
  if (!tripId){ content.innerHTML = '<div class="empty">No trip specified.</div>'; return; }
  try{
    const res = await fetch(`/api/trip/${tripId}/share`);
    if (!res.ok){
      content.innerHTML = '<div class="empty">This trip has ended or the link has expired.</div>';
      return;
    }
    const t = await res.json();
    const s = statusLabel(t.status, t.driverArrived);
    content.innerHTML = `
      <span class="status-pill ${s.cls}">${s.text}</span>
      <div class="row"><span>Driver</span><b>${t.driverName || '—'}</b></div>
      <div class="row"><span>Vehicle</span><b>${[t.vehicleColor, t.vehicleModel].filter(Boolean).join(' ') || '—'}</b></div>
      <div class="row"><span>Plate</span><b>${t.vehiclePlate || '—'}</b></div>
      ${t.fare ? `<div class="row"><span>Agreed fare</span><b>UGX ${Number(t.fare).toLocaleString()}</b></div>` : ''}
    `;
  }catch(e){
    content.innerHTML = '<div class="empty">Could not load trip status right now.</div>';
  }
}
load();
setInterval(load, 6000);
</script>
</body>
</html>
